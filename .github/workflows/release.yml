name: release

# Builds the verified JAR, wraps it into a Windows app that needs no Java and
# no installation (jpackage app-image with its own trimmed runtime), and puts
# both on a GitHub release. Three ways to start it:
#   - push a tag v1.2.3;
#   - publish a release on GitHub (Releases > Draft a new release, new tag
#     v1.2.3): the files are added to it;
#   - Actions > release > Run workflow, with the version (1.2.3): the tag and
#     the release are created on the chosen branch's last commit.
# Run by hand without a version, it only builds the two files as artifacts.

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.3.0 (empty = build only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: which release
        id: tag
        shell: bash
        run: |
          tag=""
          case "${{ github.event_name }}" in
            push)              tag="${{ github.ref_name }}" ;;
            release)           tag="${{ github.event.release.tag_name }}" ;;
            workflow_dispatch) v="${{ github.event.inputs.version }}"; v="${v#v}"; [ -n "$v" ] && tag="v$v" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag:-none (build only)}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: install build and display tools
        run: sudo apt-get update && sudo apt-get install -y ant xvfb

      - name: verify source and standalone jar
        run: ./verify.sh

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: dist/AutoFillSuite.jar
          if-no-files-found: error

  windows:
    needs: jar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist

      - name: build the Windows app (no Java, no installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.0.0'
          $tag = '${{ needs.jar.outputs.tag }}'
          if ($tag) { $version = $tag.TrimStart('v') }
          # only the modules the jar really uses, plus the extra charsets an
          # ANSI export may need: a runtime of ~50 MB instead of a whole JDK
          $mods = (jdeps --ignore-missing-deps --print-module-deps dist/AutoFillSuite.jar).Trim()
          if (-not $mods) { $mods = 'java.base,java.desktop' }
          $mods = "$mods,jdk.charsets"
          Write-Host "modules: $mods"
          jlink --add-modules $mods --strip-debug --no-header-files --no-man-pages `
                --compress=zip-6 --output build/runtime
          jpackage --type app-image --name AutoFillSuite `
                   --input dist --main-jar AutoFillSuite.jar --main-class app.Main `
                   --runtime-image build/runtime --dest build/image `
                   --app-version $version --vendor importriri `
                   --description "AutoFillSuite - registrazione etichette sul portale" `
                   --java-options "-Dfile.encoding=UTF-8"
          if (-not (Test-Path build/image/AutoFillSuite/AutoFillSuite.exe)) { throw 'no exe built' }
          # the workstation script next to the exe: one zip, extract, double-click
          Copy-Item windows/PREPARA-POSTAZIONE.bat, windows/ANNULLA-POSTAZIONE.bat, windows/prepara-postazione.ps1 `
                    -Destination build/image/AutoFillSuite/
          Compress-Archive -Path build/image/AutoFillSuite -DestinationPath AutoFillSuite-windows.zip
          Get-Item AutoFillSuite-windows.zip | Select-Object Name, Length

      # a smoke start, not a gate: a hosted runner may have no desktop to open
      # a window on. The JAR's own startup is already verified on Linux.
      - name: the exe starts (and is stopped after a few seconds)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build/image/AutoFillSuite/AutoFillSuite.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "AutoFillSuite.exe exited at once with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: AutoFillSuite-windows.zip
          if-no-files-found: error

  publish:
    needs: [jar, windows]
    if: needs.jar.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: release notes from the changelog
        env:
          TAG: ${{ needs.jar.outputs.tag }}
        run: |
          ver="${TAG#v}"
          awk -v v="$ver" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "**Windows:** scarica \`AutoFillSuite-windows.zip\`, estrai la cartella e apri \`AutoFillSuite.exe\`. Non serve Java e non serve installare niente."
            echo
            echo "**Con Java già installato:** \`AutoFillSuite.jar\`."
          } >> notes.md
          cat notes.md

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.jar.outputs.tag }}
        run: |
          files="assets/windows/AutoFillSuite-windows.zip assets/jar/AutoFillSuite.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # made on GitHub (or by a previous run): add the files, keep its notes
            gh release upload "$TAG" $files --clobber
            body="$(gh release view "$TAG" --json body -q .body)"
            if [ -z "$body" ]; then gh release edit "$TAG" --notes-file notes.md; fi
          else
            gh release create "$TAG" $files --target "$GITHUB_SHA" \
              --title "AutoFillSuite $TAG" --notes-file notes.md
          fi
