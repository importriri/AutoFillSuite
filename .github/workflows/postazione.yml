name: postazione

# the workstation script, run for real on Windows: Chrome's icons, the
# startup icon and AutoFillSuite's settings, then a second run with another
# address, then undo. Windows PowerShell 5.1, like the company PCs.

on:
  push:
    paths: ['windows/**', '.github/workflows/postazione.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/postazione.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: a workstation like the real one
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $desk = [Environment]::GetFolderPath('Desktop')
          New-Item -ItemType Directory -Force -Path $desk | Out-Null
          $sh = New-Object -ComObject WScript.Shell
          $chrome = (Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe').'(default)'
          $l = $sh.CreateShortcut((Join-Path $desk 'Google Chrome.lnk'))
          $l.TargetPath = $chrome
          $l.Arguments = '--profile-directory="Default"'
          $l.Save()
          New-Item -ItemType Directory -Force -Path (Join-Path $desk 'PrintProxy8889') | Out-Null
          Set-Content -Path (Join-Path $desk 'PrintProxy8889\Alpitronic.ZebraPrinter.Proxy.App.exe') -Value 'x'
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\AutoFillSuite" | Out-Null
          Copy-Item windows\* "$env:RUNNER_TEMP\AutoFillSuite\"
          Set-Content -Path "$env:RUNNER_TEMP\AutoFillSuite\AutoFillSuite.exe" -Value 'x'
          $props = Join-Path $env:USERPROFILE '.autofill_suite.properties'
          Set-Content -Path $props -Value @('#AutoFill Suite - settings', 'reg.downloadDir=C\:\\Users\\x\\Downloads', 'station.lastDay=2026-10-23', 'ui.flavor=latte')

      - name: prepare
        shell: powershell
        run: |
          & "$env:RUNNER_TEMP\AutoFillSuite\prepara-postazione.ps1" -Url 'lifecycle.example.test/supplier/tca' -Quiet
          if ($LASTEXITCODE -ne 0) { throw "the script reported [KO] lines" }

      - name: check
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fail = 0
          function Check($what, $cond, $seen = '') { if ($cond) { Write-Host "  ok   $what" } else { Write-Host "::error::FAIL $what -- seen: $seen"; $script:fail++ } }
          $desk = [Environment]::GetFolderPath('Desktop')
          $sh = New-Object -ComObject WScript.Shell
          $url = 'https://lifecycle.example.test/supplier/tca'
          $c = $sh.CreateShortcut((Join-Path $desk 'Google Chrome.lnk'))
          Check 'the Chrome icon opens the portal, its own arguments kept' ($c.Arguments -eq ('--profile-directory="Default" "' + $url + '"'))
          $p = $sh.CreateShortcut((Join-Path $desk 'Portale Lifecycle.lnk'))
          Check 'a Portale icon opens the portal in Chrome' ($p.TargetPath -like '*\chrome.exe' -and $p.Arguments -eq ('"' + $url + '"'))
          $s = $sh.CreateShortcut((Join-Path ([Environment]::GetFolderPath('Startup')) 'AutoFillSuite.lnk'))
          Check 'AutoFillSuite starts with Windows, the exe next to the script' ($s.TargetPath -eq "$env:RUNNER_TEMP\AutoFillSuite\AutoFillSuite.exe")
          Check 'the original Chrome icon is kept' ((Get-ChildItem "$env:LOCALAPPDATA\AutoFillSuite-icone-originali" -Filter *.lnk).Count -eq 1)
          # read the settings the way the app does: java.util.Properties
          Set-Content -Path "$env:RUNNER_TEMP\Read.java" -Value @(
            'import java.io.*; import java.util.*;',
            'public class Read { public static void main(String[] a) throws Exception {',
            '  Properties p = new Properties(); try (InputStream in = new FileInputStream(a[0])) { p.load(in); }',
            '  for (String k : new TreeSet<>(p.stringPropertyNames())) System.out.println(k + "=" + p.getProperty(k)); } }')
          $props = Join-Path $env:USERPROFILE '.autofill_suite.properties'
          $read = & java "$env:RUNNER_TEMP\Read.java" $props
          $read | ForEach-Object { Write-Host "    $_" }
          $kv = @{}
          foreach ($line in $read) { $i = $line.IndexOf('='); $kv[$line.Substring(0, $i)] = $line.Substring($i + 1) }
          Check 'the app reads the portal address' ($kv['station.portalUrl'] -eq $url)
          Check 'the app reads the browser, a real chrome.exe' ($kv['station.browserPath'] -like '*\chrome.exe' -and (Test-Path $kv['station.browserPath']))
          Check 'the app reads the print program' ($kv['station.proxyPath'] -eq (Join-Path $desk 'PrintProxy8889\Alpitronic.ZebraPrinter.Proxy.App.exe'))
          Check 'switched on' ($kv['station.autoStart'] -eq 'true')
          Check 'the day it last prepared is gone, so the next start prepares' (-not $kv.ContainsKey('station.lastDay'))
          Check 'the other settings are untouched' ($kv['reg.downloadDir'] -eq 'C:\Users\x\Downloads' -and $kv['ui.flavor'] -eq 'latte')
          if ($fail -gt 0) { Write-Host "::error::$fail checks failed"; exit 1 }
          exit 0

      - name: prepare again with another address, then undo
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fail = 0
          function Check($what, $cond, $seen = '') { if ($cond) { Write-Host "  ok   $what" } else { Write-Host "::error::FAIL $what -- seen: $seen"; $script:fail++ } }
          $out = & "$env:RUNNER_TEMP\AutoFillSuite\prepara-postazione.ps1" -Url 'https://other.example.test/tca' -Quiet *>&1
          $out | ForEach-Object { Write-Host $_; if ("$_" -like '*[KO]*') { Write-Host "::error::second run: $_" } }
          $desk = [Environment]::GetFolderPath('Desktop')
          $sh = New-Object -ComObject WScript.Shell
          $c = $sh.CreateShortcut((Join-Path $desk 'Google Chrome.lnk'))
          Check 'a second run replaces the address, never two' ($c.Arguments -eq '--profile-directory="Default" "https://other.example.test/tca"') $c.Arguments
          $kept = @(Get-ChildItem "$env:LOCALAPPDATA\AutoFillSuite-icone-originali" -Filter *.lnk)
          Check 'and keeps the very first original' ($kept.Count -eq 1) ($kept.Name -join ', ')
          $out = & "$env:RUNNER_TEMP\AutoFillSuite\prepara-postazione.ps1" -Undo -Quiet *>&1
          $out | ForEach-Object { Write-Host $_; if ("$_" -like '*[KO]*') { Write-Host "::error::undo: $_" } }
          $c = $sh.CreateShortcut((Join-Path $desk 'Google Chrome.lnk'))
          Check 'undo puts the Chrome icon back' ($c.Arguments -eq '--profile-directory="Default"') $c.Arguments
          Check 'undo removes the Portale icon' (-not (Test-Path (Join-Path $desk 'Portale Lifecycle.lnk')))
          Check 'undo removes the start with Windows' (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Startup')) 'AutoFillSuite.lnk')))
          $props = Get-Content (Join-Path $env:USERPROFILE '.autofill_suite.properties')
          Check 'undo switches the station off' ($props -contains 'station.autoStart=false') ($props -join ' | ')
          if ($fail -gt 0) { Write-Host "::error::$fail checks failed"; exit 1 }
          exit 0
